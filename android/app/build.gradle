plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // Firebase
}

android {
    namespace "com.example.untitled1" // ✅ Matches package name
    compileSdkVersion 35 // Changed from 'compileSdk = 35' for better compatibility
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.example.untitled1" // ✅ Matches namespace
        minSdkVersion flutter.minSdkVersion // Changed from 'minSdk = 21'
        targetSdkVersion 35 // Changed from 'targetSdk = 35'
        versionCode flutter.versionCode.toInteger() // Explicit conversion
        versionName flutter.versionName
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Add proguard rules for tflite_flutter
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // 🔄 Desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' // Downgraded for stability

    // 🔥 tflite_flutter requires these:
    implementation 'org.tensorflow:tensorflow-lite:2.14.0' // Explicit version
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0' // For GPU support

    // 📸 CameraX (updated to latest stable)
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"

    // 📦 Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    // 🖥️ Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22" // JDK8 variant
}
